name: Package

on:
  pull_request:
    branches: ["**"]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without v prefix)"
        required: false
        default: "0.1.0-dev"

env:
  GO_VERSION: "1.25"

jobs:
  build-deb:
    name: Build deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "GPMA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            echo "GPMA_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "GPMA_VERSION=0.1.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-21-jre-headless
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build deb
        run: packaging/scripts/build-deb.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpma-deb-${{ env.GPMA_VERSION }}
          path: packaging/dist/gpma_*.deb
          retention-days: 3
